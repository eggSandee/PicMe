<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PicMe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #collage {
      width: 100vw; height: 100vh;
      display: grid;
      gap: 12px;
      padding: 12px;
      background: #1a1a1a;
    }

    .slot {
      position: relative;
      overflow: hidden;
      background: #111;
      /* Pill tokens: set per slot by applyPillStyle (pill-size.js); these are the fallbacks */
      --pill-inset: 10px;
      --pill-font-size: 12px;
      --pill-pad-y: 0.25em;
      --pill-pad-x: 0.75em;
      --pill-gap: 4px;
      --pill-radius: 999px;
    }

    /* Mat sits inside the slot, providing the matte border around the photo */
    .mat-frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f0e8;
      box-sizing: border-box;
    }

    /* Media sit inside the mat: --mat is the mat width, set per slot by applyFrameStyle;
       --mat-bottom is the bottom mat, wider when it holds a caption (labels on the mat) */
    .mat-frame img, .mat-frame video {
      width: calc(100% - 2 * var(--mat, 0px));
      height: calc(100% - var(--mat, 0px) - var(--mat-bottom, var(--mat, 0px)));
      object-fit: contain; /* default; overridden per-slot by applyFrameStyle */
      position: absolute;
      top: var(--mat, 0px); left: var(--mat, 0px);
      transition: opacity 0.8s ease;
    }

    .mat-frame img.hidden, .mat-frame video.hidden { opacity: 0; }
    .mat-frame img.visible, .mat-frame video.visible { opacity: 1; }

    /* A slot shows either its img pair or its video pair, never both */
    .mat-frame video { display: none; }
    .slot.video-mode .mat-frame video { display: block; }
    .slot.video-mode .mat-frame img { display: none; }

    /* Pills read only the --pill-* tokens, so anything that sets them (a slot, a mat opening)
       gets the same pills */
    .slot-overlay {
      position: absolute;
      bottom: var(--pill-inset);
      left: var(--pill-inset);
      max-width: calc(100% - 2 * var(--pill-inset));
      max-height: calc(100% - 2 * var(--pill-inset));
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--pill-gap);
      font-size: var(--pill-font-size);
      z-index: 10;
      pointer-events: none;
    }

    .overlay-pill {
      flex-shrink: 0;
      max-width: 100%;
      background: rgba(20, 20, 20, 0.62);
      /* Faint light edge keeps the pill's shape visible over black mats, letterbox and night */
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: var(--pill-font-size);
      line-height: 1.25;
      padding: var(--pill-pad-y) var(--pill-pad-x);
      border-radius: var(--pill-radius);
      backdrop-filter: blur(4px);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .overlay-pill.visible { opacity: 1; }
    /* Hidden by fitOverlay when the slot is too short for every pill */
    .overlay-pill.fit-hidden { display: none; }

    /* Labels on the mat (label_position): a caption under the photo — one centred row, date
       first. Nothing but mat behind it, so no blur. fitOverlay lets long pills shrink (and
       scroll) once it has measured them, and the date only when it alone is too wide. */
    .slot-overlay.caption { flex-direction: row; align-items: center; max-height: none; }
    .slot-overlay.caption .overlay-pill { backdrop-filter: none; }
    .slot-overlay.caption .overlay-pill[data-date] { order: -1; }
    .slot-overlay.caption.caption-fit .overlay-pill:not([data-date]),
    .slot-overlay.caption .overlay-pill.caption-squeeze { flex-shrink: 1; }
    .slot-overlay.caption .overlay-pill.caption-squeeze { min-width: 0; }

    /* Text that doesn't fit scrolls (fitOverlay sets the animation); it is never cut with "…" */
    .pill-clip { display: block; overflow: hidden; }
    /* Soft edges while scrolling, instead of glyphs cut hard at the padding */
    .overlay-pill.scrolling .pill-clip {
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 0.5em, #000 calc(100% - 0.5em), transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 0.5em, #000 calc(100% - 0.5em), transparent 100%);
    }
    .pill-text { display: inline-block; vertical-align: top; width: -webkit-max-content; width: max-content; }
    @media (prefers-reduced-motion: reduce) {
      .pill-text { animation: none !important; }
    }

    #editor-btn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      cursor: pointer;
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 999;
    }

    body:hover #editor-btn { opacity: 1; }

    #error-banner {
      position: fixed;
      top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(200,0,0,0.85);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="collage"></div>
  <div id="error-banner"></div>
  <a id="editor-btn" href="/editor">⚙ Editor</a>

  <script src="/display/layout-rotation.js"></script>
  <script src="/display/pill-size.js"></script>
  <script src="/assets/frames/frames.js"></script>
  <script src="/display/shapes.js"></script>
  <script src="/display/gallery.js"></script>
  <script>
    const API = '';  // same origin

    let config = null;
    let layouts = null;
    let activeSlots = [];
    let activeLayoutId = null;  // the layout on screen (today's pick when rotation is on)
    let activeLayout = null;
    let activeMode = 'slots';   // 'gallery': one frame and mat, slots are openings (gallery.js)

    async function fetchJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${url} returned ${r.status}`);
      return r.json();
    }

    function showError(msg) {
      const el = document.getElementById('error-banner');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 6000);
    }

    // A slot's media and pill overlay — the same for a separate-frame slot and a gallery opening
    function makeSlotMedia() {
      // Mat/frame wrapper — provides the matte border and optional outer frame
      const matFrame = document.createElement('div');
      matFrame.className = 'mat-frame';

      // Two img elements for crossfade, inside the mat
      const imgA = document.createElement('img');
      const imgB = document.createElement('img');
      imgA.className = 'visible';
      imgB.className = 'hidden';
      matFrame.append(imgA, imgB);

      // Two video elements for video-mode slots, crossfaded the same way.
      // No `loop` attribute — loops are counted manually in the `ended` handler.
      const vidA = document.createElement('video');
      const vidB = document.createElement('video');
      for (const v of [vidA, vidB]) {
        v.muted = true;
        v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.preload = 'auto';
      }
      vidA.className = 'visible';
      vidB.className = 'hidden';
      matFrame.append(vidA, vidB);

      // Metadata overlay sits above the mat, anchored to the slot.
      // Pills are created dynamically in updateOverlay so hidden fields take no space.
      const overlay = document.createElement('div');
      overlay.className = 'slot-overlay';

      return { matFrame, overlay };
    }

    function applyLayout(layout, slotCount) {
      const collage = document.getElementById('collage');
      collage.dataset.layout = layout.id;
      collage.dataset.mode = activeMode;

      // Gallery mat: one frame and mat, each slot an opening (same #slot-N / .mat-frame DOM)
      if (activeMode === 'gallery') {
        PicMeGallery.build(collage, layout, slotCount, { makeSlot: makeSlotMedia });
        return;
      }

      collage.style.gridTemplateColumns = layout.grid_template_columns;
      collage.style.gridTemplateRows = layout.grid_template_rows;

      collage.innerHTML = '';
      for (let i = 0; i < slotCount; i++) {
        const slotDef = layout.slots[i];
        const div = document.createElement('div');
        div.className = 'slot';
        div.id = `slot-${slotDef.id}`;
        div.style.gridArea = slotDef.grid_area;
        const { matFrame, overlay } = makeSlotMedia();
        div.append(matFrame, overlay);
        collage.appendChild(div);
      }
    }

    function imageUrl(filePath) {
      return `${API}/api/image?path=${encodeURIComponent(filePath)}`;
    }

    function videoUrl(filePath) {
      return `${API}/api/video?path=${encodeURIComponent(filePath)}`;
    }

    function getTimeOfDayTemplate() {
      const tod = config?.time_of_day;
      if (!tod?.enabled) return null;
      const now = new Date();
      const cur = now.getHours() * 60 + now.getMinutes();
      const [dh, dm] = (tod.day_start || '07:00').split(':').map(Number);
      const [nh, nm] = (tod.night_start || '20:00').split(':').map(Number);
      const dayMins = dh * 60 + dm, nightMins = nh * 60 + nm;
      const isDay = dayMins < nightMins
        ? (cur >= dayMins && cur < nightMins)
        : (cur >= dayMins || cur < nightMins);
      return isDay ? (tod.day || null) : (tod.night || null);
    }

    function getTodPeriodName() {
      const tod = config?.time_of_day;
      if (!tod?.enabled) return null;
      return getTimeOfDayTemplate() === tod.day ? 'day' : 'night';
    }

    let lastTodPeriod = null;

    // Where this screen's pills go: 'mat' (a caption under each photo) or 'photo'
    function labelPlacement() {
      return window.PicMePills ? PicMePills.labelPlacement(config.label_position, activeMode) : 'photo';
    }

    // Whether the slot puts any pill on screen (video slots only show the date)
    function slotHasPills(slotCfg) {
      if (config.show_metadata === false) return false;
      const meta = effectiveMeta(slotCfg);
      return !!meta.show_date || (slotCfg.mode !== 'video' && METADATA_FIELDS.some(f => meta[f.flag]));
    }

    // Frames, then one pill size for every slot on screen (README → Metadata pills): each slot's
    // pill area is measured, the shortest side sizes them all, and labels on the mat get a
    // caption band sized from it.
    function applyTodStyles() {
      const tod = getTimeOfDayTemplate();
      const collage = document.getElementById('collage');
      collage.style.background = tod?.wall_color ?? config.wall_color ?? '#1a1a1a';
      const placement = labelPlacement();
      collage.dataset.labels = placement;
      // Each slot's pill sizes, or null for a slot without pills (it doesn't set the size)
      const sizes = activeSlots.map(s => (slotHasPills(s) ? (window.PicMePills?.resolve(effectiveMeta(s)) ?? {}) : null));
      let short = 0;
      if (activeMode === 'gallery') {
        // One frame and mat for the whole display (time of day changes their colours only);
        // per-slot frame settings apply on separate-frame layouts
        ({ short } = PicMeGallery.layoutWithLabels(collage, PicMeGallery.resolveGallery(config, tod), activeLayout,
                                                  activeSlots, { placement, sizes }));
        for (const slotCfg of activeSlots) {
          const slotEl = document.getElementById(`slot-${slotCfg.id}`);
          if (slotEl) applyFit(slotEl, slotCfg);
        }
      } else {
        short = applySlotFrames(placement, sizes);
      }
      for (const slotCfg of activeSlots) {
        const slotEl = document.getElementById(`slot-${slotCfg.id}`);
        if (slotEl) applyPillStyle(slotEl, slotCfg, short);
      }
      lastTodPeriod = getTodPeriodName();
    }

    // Separate frames for every slot on screen, with a caption band in each bottom mat when the
    // labels are on the mat. Returns the shortest pill area on screen. The band is sized from
    // the areas measured before it, so the two can't feed back.
    function applySlotFrames(placement, sizes) {
      const P = window.PicMePills;
      const mat = placement === 'mat';
      const els = activeSlots.map(s => document.getElementById(`slot-${s.id}`));
      const geo = activeSlots.map((s, i) => (els[i] ? applyFrameStyle(els[i], s, 0) : null));
      // A caption labels the whole photo; on the photo, pills keep --pill-inset from the slot edge
      const area = g => (mat ? g.photo : { w: g.slot.w - 2 * g.inset, h: g.slot.h - 2 * g.inset });
      const all = geo.filter(Boolean);
      const shown = geo.filter((g, i) => g && sizes[i]);
      const short = P ? P.sharedShort((shown.length ? shown : all).map(area)) : 0;
      if (mat && P && shown.length) {
        const need = Math.max(...sizes.filter(Boolean).map(s => P.captionBand(s, short)));
        const band = Math.min(need, Math.floor(P.CAPTION_MAX_FRACTION * Math.min(...all.map(g => g.photo.h))));
        activeSlots.forEach((s, i) => { if (els[i]) applyFrameStyle(els[i], s, band); });
      }
      return short;
    }

    const TOD_FRAME_KEYS = ['mat_color', 'mat_width', 'show_frame', 'frame_color', 'frame_width', 'frame_style'];

    // A decorative frame style (wood, gold, ...) from frames.js, or null for a solid frame.
    // If frames.js didn't load, every frame falls back to solid.
    function frameAsset(style) {
      const frames = window.PICME_FRAMES;
      return frames && style && Object.prototype.hasOwnProperty.call(frames, style) ? frames[style] : null;
    }

    // The slot's frame and mat; `band` px more bottom mat holds a caption (labels on the mat).
    // Returns { slot, photo: {w, h}, inset }: the slot's size, the photo's space inside the
    // frame and mat (before the band), and the slot's --pill-inset.
    function applyFrameStyle(slotEl, slotCfg, band = 0) {
      const matFrame = slotEl.querySelector('.mat-frame');
      if (!matFrame) return null;

      // TOD template sits between global defaults and per-slot overrides in priority.
      // Only keys the template sets: an unset key must not blank out the global value.
      const tod = getTimeOfDayTemplate();
      const todFrame = {};
      if (tod) for (const key of TOD_FRAME_KEYS) if (tod[key] !== undefined) todFrame[key] = tod[key];
      const frameCfg = { ...(config.frame_defaults || {}), ...todFrame, ...(slotCfg.frame || {}) };

      const matWidth  = Number(frameCfg.mat_width ?? 16) || 0;
      const matColor  = frameCfg.mat_color  ?? '#000000';
      const frameOn   = frameCfg.show_frame ?? true;
      const frameWidth = frameCfg.frame_width ?? 8;
      const frameColor = frameCfg.frame_color ?? '#2c2318';
      const asset = frameOn ? frameAsset(frameCfg.frame_style ?? 'solid') : null;

      matFrame.style.padding    = `${matWidth}px`;
      matFrame.style.paddingBottom = `${matWidth + band}px`;
      matFrame.style.setProperty('--mat', `${matWidth}px`);
      if (band > 0) matFrame.style.setProperty('--mat-bottom', `${matWidth + band}px`);
      else matFrame.style.removeProperty('--mat-bottom');
      matFrame.style.background = matColor;
      let border = 0;
      if (asset) {
        // A 9-slice PNG: corners scale uniformly (never stretch) and edges tile with `round`.
        // On a small slot the moulding is capped at a sixth of the short side.
        const fit = Math.floor(Math.min(slotEl.clientWidth, slotEl.clientHeight) / 6);
        const w = Math.min(Number(frameWidth) || 0, Math.max(4, fit));
        matFrame.style.border = `${w}px solid transparent`;
        matFrame.style.borderImage = `url("${asset.src}") ${asset.slice} / ${w}px / 0 round`;
        matFrame.style.backgroundClip = 'padding-box';
        // Keep the metadata pills inside the moulding
        slotEl.style.setProperty('--pill-inset', `${w + 10}px`);
        border = w;
      } else {
        matFrame.style.border = frameOn ? `${frameWidth}px solid ${frameColor}` : 'none';
        matFrame.style.borderImage = 'none';
        matFrame.style.backgroundClip = '';
        slotEl.style.removeProperty('--pill-inset');
        border = frameOn ? Number(frameWidth) || 0 : 0;
      }

      // A caption sits in the bottom mat, under the photo, centred on it
      const edge = border + matWidth;
      const slotW = slotEl.clientWidth, slotH = slotEl.clientHeight;
      const overlay = slotEl.querySelector('.slot-overlay');
      if (overlay) {
        overlay.classList.toggle('caption', band > 0);
        Object.assign(overlay.style, band > 0
          ? { left: `${edge}px`, right: `${edge}px`, bottom: `${edge}px`, height: `${band}px`,
              width: 'fit-content', margin: '0 auto', maxWidth: `${Math.max(0, slotW - 2 * edge)}px` }
          : { left: '', right: '', bottom: '', height: '', width: '', margin: '', maxWidth: '' });
      }

      applyFit(slotEl, slotCfg);
      return { slot: { w: slotW, h: slotH }, photo: { w: Math.max(0, slotW - 2 * edge), h: Math.max(0, slotH - 2 * edge) },
               inset: pillInset(slotEl) };
    }

    // Fit (contain, letterboxed) or Fill (cover, cropped) — per slot, in either mode
    function applyFit(slotEl, slotCfg) {
      const fit = slotCfg.fill_mode === 'cover' ? 'cover' : 'contain';
      slotEl.querySelectorAll('.mat-frame img, .mat-frame video').forEach(el => el.style.objectFit = fit);
    }

    // ── Metadata pill size (README → Metadata pills) ──

    // The slot's metadata settings: global defaults, plus the slot's own when it doesn't use global
    function effectiveMeta(slotCfg) {
      return (slotCfg.use_global?.metadata !== false)
        ? (config.metadata_defaults || {})
        : { ...(config.metadata_defaults || {}), ...(slotCfg.metadata || {}) };
    }

    function pillInset(slotEl) {
      return parseFloat(getComputedStyle(slotEl).getPropertyValue('--pill-inset')) || 0;
    }

    // Set the slot's pill tokens, then re-fit its pills. `short`: the shortest pill area on
    // screen (applyTodStyles), so every slot gets the same size; the slot's own text_size (with
    // use_global.metadata off) scales it. Without pill-size.js the CSS fallbacks apply.
    function applyPillStyle(slotEl, slotCfg, short) {
      if (window.PicMePills) {
        const tokens = PicMePills.tokens(PicMePills.resolve(effectiveMeta(slotCfg)), short, short);
        for (const [name, value] of Object.entries(tokens)) slotEl.style.setProperty(name, value);
      }
      fitOverlay(slotEl);
    }

    // One @keyframes rule per scroll distance, added on first use
    const marqueeRules = new Set();
    let marqueeSheet = null;

    function marqueeAnimation(distance, windowSec) {
      const m = window.PicMePills?.marquee(distance, windowSec);
      if (!m) return '';
      if (!marqueeRules.has(m.name)) {
        if (!marqueeSheet) marqueeSheet = document.head.appendChild(document.createElement('style')).sheet;
        marqueeSheet.insertRule(m.css, marqueeSheet.cssRules.length);
        marqueeRules.add(m.name);
      }
      return `${m.name} ${m.duration.toFixed(2)}s linear infinite`;
    }

    // Make the slot's pills fit inside the overlay (on the photo: the slot minus --pill-inset on
    // each side; on the mat: one row in the caption band):
    // 1. Too many: hide non-date pills from the lowest priority up. The date is never hidden.
    //    On the photo, a date that alone doesn't fit drops to the smallest font and the overlay
    //    clips it; in a caption, long pills first shrink to a few words, and a date that alone
    //    is too wide shrinks too.
    // 2. Too wide: the pill's text scrolls slowly back and forth (static under reduced motion).
    // Hidden pills stay in the DOM, so a resize can bring them back.
    function fitOverlay(slotEl) {
      const overlay = slotEl.querySelector('.slot-overlay');
      if (!overlay) return;
      const pills = [...overlay.querySelectorAll('.overlay-pill')];
      overlay.style.removeProperty('--pill-font-size');
      overlay.classList.remove('caption-fit');
      pills.forEach(p => { p.classList.remove('fit-hidden', 'caption-squeeze'); p.style.minWidth = ''; });
      if (pills.length === 0) return;

      const caption = overlay.classList.contains('caption');
      const overflows = caption
        ? () => overlay.scrollWidth > overlay.clientWidth + 0.5
        : () => overlay.scrollHeight > overlay.clientHeight + 0.5;
      const optional = pills.filter(p => !p.dataset.date);
      if (caption && window.PicMePills) {
        // Measured at full width, then allowed to shrink to CAPTION_PILL_MIN_EM (or their own width)
        const em = parseFloat(getComputedStyle(pills[0]).fontSize) || 16;
        const widths = optional.map(p => p.offsetWidth);
        optional.forEach((p, i) => { p.style.minWidth = `${Math.min(widths[i], PicMePills.CAPTION_PILL_MIN_EM * em)}px`; });
        overlay.classList.add('caption-fit');
      }
      while (overflows() && optional.length) optional.pop().classList.add('fit-hidden');
      if (overflows()) {
        if (caption) pills.forEach(p => { if (p.dataset.date) p.classList.add('caption-squeeze'); });
        else if (window.PicMePills) overlay.style.setProperty('--pill-font-size', `${PicMePills.FONT_MIN}px`);
      }

      // A photo slot shows each photo for cycle_seconds; video slots have no fixed window
      const slotCfg = (config.slots || []).find(s => `slot-${s.id}` === slotEl.id);
      const windowSec = slotCfg && slotCfg.mode !== 'video' ? Number(slotCfg.cycle_seconds) : undefined;

      // Measure every pill first, then write, so this lays out once
      const visible = pills.filter(p => !p.classList.contains('fit-hidden'));
      const distances = visible.map(p => {
        const clip = p.querySelector('.pill-clip'), text = p.querySelector('.pill-text');
        return clip && text ? text.offsetWidth - clip.clientWidth : 0;
      });
      visible.forEach((p, i) => {
        const text = p.querySelector('.pill-text');
        if (!text) return;
        const scrolls = distances[i] >= 1;
        p.classList.toggle('scrolling', scrolls);
        const animation = scrolls ? marqueeAnimation(distances[i], windowSec) : '';
        // Same distance as last time: leave the running scroll alone
        if ((text.dataset.marquee || '') === animation) return;
        text.dataset.marquee = animation;
        text.style.animation = animation;
      });
    }

    // Shuffled queue per source (folder + subfolders flag) and media kind — ensures no file repeats until all are shown,
    // and no two slots show the same photo or video at the same time. A slot claims its next
    // photo before loading it and releases the old one when it swaps, so when every slot ticks
    // at once the free photos can run out; a slot then waits for another slot's swap to free one
    // (see loadNextImage) rather than doubling up. Repeats only fill blank slots in a library
    // with fewer usable photos than slots.
    const folderQueues = {};     // `${kind}:${source.key}` -> { images, index }
    const queueLoads = {};       // `${kind}:${source.key}` -> in-flight list request, shared by concurrent slots
    // Paths claimed by a slot (on screen or loading), with a claim count — a small library can
    // force a repeat, so one slot releasing a path must not free it while another still shows it
    const displayedPaths = new Map();
    // Photos and videos that failed to load or decode — skipped until their folder is retried
    const unplayablePaths = new Set();
    // Slots waiting for a claim to be released, and photo loads that will release one when done
    const releaseWaiters = new Set();
    let photoLoadsInFlight = 0;

    function claimPath(path) {
      displayedPaths.set(path, (displayedPaths.get(path) || 0) + 1);
    }

    function releasePath(path) {
      const n = displayedPaths.get(path) || 0;
      if (n <= 1) displayedPaths.delete(path);
      else displayedPaths.set(path, n - 1);
      for (const wake of [...releaseWaiters]) wake();
    }

    // Resolves on the next release, or after `ms` if none comes
    function waitForRelease(ms) {
      return new Promise(resolve => {
        const wake = () => { clearTimeout(timer); releaseWaiters.delete(wake); resolve(); };
        const timer = setTimeout(wake, ms);
        releaseWaiters.add(wake);
      });
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Video lists only include clips the browser can play now — iPhone (HEVC) clips appear once
    // the server has converted them, so video queues are re-listed every pass and every 5 min.
    const VIDEO_RELIST_MS = 5 * 60 * 1000;

    function listUrl(source, kind) {
      return `${API}/api/images/list?folder=${encodeURIComponent(source.folder || '')}&kind=${kind}&recursive=${source.recursive ? 1 : 0}`;
    }

    async function ensureQueue(source, kind = 'photos') {
      const key = `${kind}:${source.key}`;
      const q = folderQueues[key];
      const stale = q && kind === 'video' && (q.stale || Date.now() - q.loadedAt > VIDEO_RELIST_MS);
      if (q && !stale) return q;
      // Slots start concurrently — share one request so they all draw from the same shuffled queue
      if (!queueLoads[key]) {
        queueLoads[key] = fetchJSON(listUrl(source, kind))
          .then(data => {
            if (kind === 'video') {
              // Forget failures for this folder's files that are gone — other folders' entries
              // are left alone, as are claims in displayedPaths
              const listed = new Set(data.images);
              for (const p of q?.images || []) if (!listed.has(p)) unplayablePaths.delete(p);
            }
            return folderQueues[key] = { images: shuffle(data.images), index: 0, loadedAt: Date.now() };
          })
          .catch(e => { if (q) return q; throw e; })  // a failed re-list keeps the old queue
          .finally(() => delete queueLoads[key]);
      }
      return queueLoads[key];
    }

    // `fallback` is returned instead of a repeat when every file is on screen or unplayable
    function nextFromQueue(source, kind = 'photos', fallback = null) {
      const q = folderQueues[`${kind}:${source.key}`];
      if (!q || q.images.length === 0) return null;
      // Walk through the queue to find an image not currently displayed
      for (let attempts = 0; attempts < q.images.length; attempts++) {
        const candidate = q.images[q.index % q.images.length];
        q.index++;
        if (q.index >= q.images.length) {
          // Reshuffle on wrap-around so we don't get the same sequence again
          shuffle(q.images);
          q.index = 0;
          if (kind === 'video') q.stale = true;  // re-list next time to pick up newly converted clips
        }
        if (!displayedPaths.has(candidate) && !unplayablePaths.has(candidate)) return candidate;
      }
      // All images currently displayed (very small library) — allow a repeat, but never of a bad file
      return fallback ?? q.images.find(p => !unplayablePaths.has(p)) ?? null;
    }

    // Per-slot state
    const slotState = {};

    function slotFolder(slotCfg, cfg = config) {
      return (slotCfg.use_global?.source !== false) ? (cfg.source_path || slotCfg.source_path) : slotCfg.source_path;
    }

    // Whether the slot's folder includes its subfolders (same rule as the server's
    // effective_subfolders): the global setting, unless the slot has its own folder and sets its own
    function slotSubfolders(slotCfg, cfg = config) {
      if (slotCfg.use_global?.source !== false || slotCfg.include_subfolders == null) return cfg.include_subfolders !== false;
      return slotCfg.include_subfolders !== false;
    }

    // What a slot draws from. Queues, retries and "moved" checks key on folder and flag together,
    // so toggling subfolders re-lists instead of drawing from the old queue.
    function slotSource(slotCfg, cfg = config) {
      const folder = slotFolder(slotCfg, cfg);
      const recursive = slotSubfolders(slotCfg, cfg);
      return { folder, recursive, key: `${recursive ? 'r' : 'f'}:${folder}` };
    }

    const PHOTO_RETRY_MS = 60000;  // empty folder / every photo failed — try again later
    const photoRetryTimers = {};   // source key -> pending retry

    // Wait, then forget this folder's failures, re-list it and retry its blank slots, so added or
    // replaced files are picked up. Cycle ticks in the meantime find nothing to try, so a folder
    // of bad files can't spin. One timer per folder, so slots can't reset each other's retries.
    function retryPhotoLater(source) {
      if (photoRetryTimers[source.key]) return;  // already waiting — don't push the retry back
      photoRetryTimers[source.key] = setTimeout(() => {
        delete photoRetryTimers[source.key];
        const key = `photos:${source.key}`;
        for (const p of folderQueues[key]?.images || []) unplayablePaths.delete(p);
        delete folderQueues[key];
        // Slots already showing a photo just carry on with their cycle timers
        for (const s of activeSlots) {
          if (s.mode !== 'video' && slotSource(s).key === source.key && !slotState[s.id]?.currentPath) loadNextImage(s);
        }
      }, PHOTO_RETRY_MS);
    }

    // Load `path` into the slot's hidden <img> and crossfade to it. False if it won't load.
    async function showImage(slotCfg, slotEl, path) {
      const state = slotState[slotCfg.id];
      claimPath(path);  // claim before loading so a concurrent slot can't pick it too

      const [imgA, imgB] = slotEl.querySelectorAll('.mat-frame img');
      const current = state.activeImg === 'A' ? imgA : imgB;
      const next    = state.activeImg === 'A' ? imgB : imgA;
      const url = imageUrl(path);

      photoLoadsInFlight++;
      try {
        await new Promise((resolve, reject) => {
          // Ignore a late event from an earlier attempt's src
          next.onload  = () => { if (next.getAttribute('src') === url) resolve(); };
          next.onerror = () => { if (next.getAttribute('src') === url) reject(new Error('image error')); };
          next.src = url;
        });
      } catch (e) {
        // Corrupt file, a HEIC the server couldn't convert (415), or deleted since listing
        console.warn(`Slot ${slotCfg.id}: failed to load ${path}`, e);
        releasePath(path);
        unplayablePaths.add(path);
        return false;
      } finally {
        photoLoadsInFlight--;
        next.onload = next.onerror = null;
      }

      // Release this slot's old image
      if (state.currentPath) releasePath(state.currentPath);
      state.currentPath = path;

      next.className = 'visible';
      current.className = 'hidden';
      state.activeImg = state.activeImg === 'A' ? 'B' : 'A';

      updateOverlay(slotCfg, path);
      return true;
    }

    // `folderChanged`: the slot just moved to another folder, so a load still in flight (from
    // the old folder) is followed by one from the new folder rather than the next cycle tick
    async function loadNextImage(slotCfg, folderChanged = false) {
      const state = slotState[slotCfg.id];
      const slotEl = document.getElementById(`slot-${slotCfg.id}`);
      if (!state || !slotEl) return;
      // A cycle tick while this slot is still working through failures waits for the next one
      if (state.photoLoading) {
        if (folderChanged) state.photoLoadPending = true;
        return;
      }
      state.photoLoading = true;
      const source = slotSource(slotCfg);

      try {
        let queue;
        try {
          queue = await ensureQueue(source);
        } catch (e) {
          console.warn(`Slot ${slotCfg.id}: could not list photos`, e);
          retryPhotoLater(source);
          return;
        }
        // A photo that won't load is skipped and the next one tried straight away, so a corrupt
        // first pick doesn't leave the slot blank — at most one pass over the folder
        while (true) {
          // A slot showing a photo never repeats one another slot holds: when every photo is
          // claimed (all slots ticked at once), wait for a slot mid-swap to release its old
          // photo, else keep this one for the tick. Blank slots repeat rather than stay empty.
          const own = state.currentPath;
          let nextPath = nextFromQueue(source, 'photos', own);
          const deadline = Date.now() + Math.min(5000, (slotCfg.cycle_seconds || 30) * 500);
          while (own && nextPath === own && photoLoadsInFlight > 0 && Date.now() < deadline) {
            await waitForRelease(deadline - Date.now());
            nextPath = nextFromQueue(source, 'photos', own);
          }
          if (own && nextPath === own) return;
          if (!nextPath) {
            // Empty folder, or every photo in it failed
            retryPhotoLater(source);
            return;
          }
          if (await showImage(slotCfg, slotEl, nextPath)) {
            state.photoFailures = 0;
            return;
          }
          state.photoFailures = (state.photoFailures || 0) + 1;
          if (state.photoFailures >= queue.images.length) {
            console.warn(`Slot ${slotCfg.id}: no photos would load — retrying in ${PHOTO_RETRY_MS / 1000}s`);
            state.photoFailures = 0;
            retryPhotoLater(source);
            return;
          }
        }
      } finally {
        state.photoLoading = false;
        if (state.photoLoadPending) {
          state.photoLoadPending = false;
          loadNextImage(slotCfg);
        }
      }
    }

    // ── Video playback ──
    // Video slots advance on playback events, not timers: each video plays video_loops
    // times, then the slot crossfades to the next video from its folder's video queue.

    const VIDEO_RETRY_MS = 60000;       // empty folder / every file failed — try again later
    const VIDEO_LOAD_TIMEOUT_MS = 30000; // give up on a file that never becomes playable
    const VIDEO_STALL_MS = 20000;        // buffering longer than this skips to the next video

    function videoLoops(slotCfg) {
      return Math.max(1, parseInt(slotCfg.video_loops ?? 2) || 1);
    }

    function videoEls(slotCfg) {
      const slotEl = document.getElementById(`slot-${slotCfg.id}`);
      if (!slotEl) return null;
      const [vidA, vidB] = slotEl.querySelectorAll('.mat-frame video');
      const state = slotState[slotCfg.id];
      return state.activeVid === 'A' ? { current: vidA, next: vidB } : { current: vidB, next: vidA };
    }

    // Drop the source so TVs free the hardware decoder (many SoCs only have 1–4)
    function releaseVideo(v) {
      v.pause();
      v.removeAttribute('src');
      v.load();
    }

    // Browsers often block autoplay with sound — fall back to muted rather than stall the slot
    async function playVideo(v, slotCfg) {
      try {
        await v.play();
      } catch (e) {
        if (v.muted) throw e;
        console.warn(`Slot ${slotCfg.id}: autoplay with sound blocked — playing muted`, e);
        v.muted = true;
        await v.play();
      }
    }

    function clearVideoTimers(state) {
      clearTimeout(state.watchdog);
      clearTimeout(state.stallTimer);
      clearTimeout(state.retryTimer);
    }

    // Per-loop watchdog: if `ended` never arrives (hung decoder, broken stream), move on
    function armWatchdog(slotCfg, v) {
      const state = slotState[slotCfg.id];
      clearTimeout(state.watchdog);
      const seconds = (isFinite(v.duration) ? v.duration : 300) + 30;
      state.watchdog = setTimeout(() => {
        console.warn(`Slot ${slotCfg.id}: playback watchdog fired — advancing`);
        loadNextVideo(slotCfg);
      }, seconds * 1000);
    }

    function retryVideoLater(slotCfg, source) {
      const state = slotState[slotCfg.id];
      clearVideoTimers(state);
      // Re-list and retry this folder's files so newly added or replaced ones are picked up
      const key = `video:${source.key}`;
      for (const p of folderQueues[key]?.images || []) unplayablePaths.delete(p);
      delete folderQueues[key];
      state.retryTimer = setTimeout(() => loadNextVideo(slotCfg), VIDEO_RETRY_MS);
    }

    function waitForPlayable(v) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => done(new Error('timed out waiting for canplay')), VIDEO_LOAD_TIMEOUT_MS);
        function done(err) {
          clearTimeout(timer);
          v.removeEventListener('canplay', onReady);
          v.removeEventListener('error', onError);
          err ? reject(err) : resolve();
        }
        const onReady = () => done();
        const onError = () => done(v.error || new Error('video error'));
        v.addEventListener('canplay', onReady);
        v.addEventListener('error', onError);
      });
    }

    async function loadNextVideo(slotCfg) {
      const state = slotState[slotCfg.id];
      if (!state || state.videoLoading) return;
      const els = videoEls(slotCfg);
      if (!els) return;
      const { current, next } = els;

      state.videoLoading = true;
      clearVideoTimers(state);
      const source = slotSource(slotCfg);
      let advanceAgain = false;

      try {
        let queue;
        try {
          queue = await ensureQueue(source, 'video');
        } catch (e) {
          console.warn(`Slot ${slotCfg.id}: could not list videos`, e);
          retryVideoLater(slotCfg, source);
          return;
        }
        // Nothing else available → keep playing this slot's own video
        const ownPath = current.getAttribute('src') ? state.currentPath : null;
        const nextPath = nextFromQueue(source, 'video', ownPath);
        if (!nextPath) {
          // Empty folder — leave the mat showing and look again later
          retryVideoLater(slotCfg, source);
          return;
        }

        // Same file again (e.g. single-video folder): restart in place — reassigning
        // the same src may never fire canplay again.
        if (nextPath === state.currentPath && current.getAttribute('src')) {
          state.playCount = 0;
          current.currentTime = 0;
          await playVideo(current, slotCfg);
          armWatchdog(slotCfg, current);
          return;
        }

        // Claim before loading — other slots pick while this one waits for canplay
        claimPath(nextPath);
        try {
          next.muted = !slotCfg.video_audio;
          next.src = videoUrl(nextPath);
          await waitForPlayable(next);
          await playVideo(next, slotCfg);
        } catch (e) {
          // E.g. a profile this TV can't decode, or a clip deleted since listing — skip it
          console.warn(`Slot ${slotCfg.id}: failed to play ${nextPath}`, e);
          releaseVideo(next);
          releasePath(nextPath);
          unplayablePaths.add(nextPath);
          state.videoFailures = (state.videoFailures || 0) + 1;
          if (state.videoFailures >= queue.images.length) {
            console.warn(`Slot ${slotCfg.id}: no playable videos — retrying in ${VIDEO_RETRY_MS / 1000}s`);
            state.videoFailures = 0;
            retryVideoLater(slotCfg, source);
          } else {
            advanceAgain = true;
          }
          return;
        }

        state.videoFailures = 0;
        if (state.currentPath) releasePath(state.currentPath);  // only ever this slot's own claim
        state.currentPath = nextPath;
        state.playCount = 0;

        next.className = 'visible';
        current.className = 'hidden';
        state.activeVid = state.activeVid === 'A' ? 'B' : 'A';

        // Freeze the outgoing video, then free its decoder once the 0.8s crossfade is done
        current.pause();
        const oldSrc = current.getAttribute('src');
        setTimeout(() => {
          if (current.classList.contains('hidden') && current.getAttribute('src') === oldSrc) releaseVideo(current);
        }, 900);

        armWatchdog(slotCfg, next);
        updateOverlay(slotCfg, nextPath);
      } catch (e) {
        console.warn(`Slot ${slotCfg.id}: video playback error`, e);
        advanceAgain = true;
      } finally {
        state.videoLoading = false;
        if (advanceAgain) setTimeout(() => loadNextVideo(slotCfg), 0);
      }
    }

    // Wire playback events once per video element of a video-mode slot
    function initVideoSlot(slotCfg) {
      const slotEl = document.getElementById(`slot-${slotCfg.id}`);
      if (!slotEl) return;
      slotEl.classList.add('video-mode');
      const state = slotState[slotCfg.id];
      const isActive = v => videoEls(slotCfg)?.current === v && !!v.getAttribute('src') && !state.videoLoading;

      slotEl.querySelectorAll('.mat-frame video').forEach(v => {
        v.addEventListener('ended', () => {
          if (!isActive(v)) return;
          // video_loops is read live so editor changes apply to the current video
          if (++state.playCount < videoLoops(slotCfg)) {
            v.currentTime = 0;
            playVideo(v, slotCfg).then(() => armWatchdog(slotCfg, v), () => loadNextVideo(slotCfg));
          } else {
            loadNextVideo(slotCfg);
          }
        });
        // Mid-playback decode/network error on the visible video
        v.addEventListener('error', () => {
          if (!isActive(v)) return;
          console.warn(`Slot ${slotCfg.id}: playback error — advancing`, v.error);
          loadNextVideo(slotCfg);
        });
        v.addEventListener('waiting', () => {
          if (!isActive(v)) return;
          clearTimeout(state.stallTimer);
          state.stallTimer = setTimeout(() => {
            console.warn(`Slot ${slotCfg.id}: playback stalled — advancing`);
            loadNextVideo(slotCfg);
          }, VIDEO_STALL_MS);
        });
        v.addEventListener('playing', () => clearTimeout(state.stallTimer));
      });
    }

    // Apply a live video_audio change to the playing video
    function applyVideoAudio(slotCfg) {
      const v = videoEls(slotCfg)?.current;
      if (!v || !v.getAttribute('src')) return;
      const muted = !slotCfg.video_audio;
      if (v.muted === muted) return;
      v.muted = muted;
      // Unmuting without a user gesture may pause the video — re-mute and keep playing
      if (!muted) playVideo(v, slotCfg).catch(() => {});
    }

    // Non-date fields in priority order. max_metadata_pills applies to these only.
    // Date is handled separately — always rendered last (bottom) if enabled.
    const METADATA_FIELDS = [
      { flag: 'show_location',      key: 'location' },
      { flag: 'show_camera',        key: 'camera' },
      { flag: 'show_megapixels',    key: 'megapixels' },
      { flag: 'show_fstop',         key: 'fstop' },
      { flag: 'show_shutter_speed', key: 'shutter_speed' },
      { flag: 'show_iso',           key: 'iso' },
      { flag: 'show_focal_length',  key: 'focal_length' },
    ];

    const DATE_FORMATS = {
      long:   { year: 'numeric', month: 'long',    day: 'numeric' }, // July 4, 2019
      medium: { year: 'numeric', month: 'short',   day: 'numeric' }, // Jul 4, 2019
      short:  { year: 'numeric', month: 'numeric', day: 'numeric' }, // 7/4/2019
    };

    function formatDate(isoDate) {
      const fmt = config.date_format || 'long';
      if (fmt === 'iso') return isoDate;
      const opts = DATE_FORMATS[fmt] || DATE_FORMATS.long;
      // Parse as local date (append T00:00 to avoid UTC shift)
      return new Intl.DateTimeFormat(undefined, opts).format(new Date(isoDate + 'T00:00'));
    }

    // The text sits in a clip box so a long pill can scroll inside its padding
    function makePill(text) {
      const pill = document.createElement('div');
      pill.className = 'overlay-pill';
      const clip = document.createElement('span');
      clip.className = 'pill-clip';
      const span = document.createElement('span');
      span.className = 'pill-text';
      span.textContent = text;
      clip.appendChild(span);
      pill.appendChild(clip);
      return pill;
    }

    async function updateOverlay(slotCfg, imagePath) {
      const slotEl = document.getElementById(`slot-${slotCfg.id}`);
      if (!slotEl) return;
      const overlay = slotEl.querySelector('.slot-overlay');
      if (!overlay) return;

      // Each call supersedes earlier ones for this slot: a metadata fetch for an older photo, or
      // one started before show_metadata was turned off, must not add its pills afterwards
      const state = slotState[slotCfg.id];
      const seq = state.overlaySeq = (state.overlaySeq || 0) + 1;

      // Clear previous pills completely — hidden elements in a flex column take up space
      overlay.innerHTML = '';

      // Global kill switch
      if (config.show_metadata === false) return;

      // Respect use_global.metadata: if true, use only global defaults (slot.metadata is empty)
      let meta = effectiveMeta(slotCfg);
      // Video slots only ever show the date pill (from the MP4/MOV container). Pill and text
      // size come from applyPillStyle, which reads the full settings, so they still apply.
      if (slotCfg.mode === 'video') meta = { show_date: meta.show_date };

      const maxPills = config.max_metadata_pills ?? Infinity;
      const anyEnabled = meta.show_date || METADATA_FIELDS.some(f => meta[f.flag]);
      if (!anyEnabled) return;

      try {
        const data = await fetchJSON(`${API}/api/metadata?path=${encodeURIComponent(imagePath)}`);
        if (seq !== state.overlaySeq || config.show_metadata === false) return;

        const pills = [];

        // Non-date fields up to the cap
        let shown = 0;
        for (const { flag, key } of METADATA_FIELDS) {
          if (shown >= maxPills) break;
          if (!meta[flag] || !data[key]) continue;
          pills.push(makePill(data[key]));
          shown++;
        }

        // Date always at bottom, not counted against the cap
        if (meta.show_date && data.date_iso) {
          const pill = makePill(formatDate(data.date_iso));
          pill.dataset.date = '1';
          pills.push(pill);
        }

        if (pills.length === 0) return;
        pills.forEach(p => overlay.appendChild(p));
        // Measured at opacity 0, before the fade-in: opacity doesn't affect layout
        fitOverlay(slotEl);
        // Double rAF so the browser registers the initial opacity:0 before transitioning to 1
        requestAnimationFrame(() => requestAnimationFrame(() => {
          pills.forEach(p => p.classList.add('visible'));
        }));
      } catch (e) {
        // Metadata is non-critical — fail silently
      }
    }

    async function folderHasMedia(source, kind) {
      try {
        const data = await fetchJSON(listUrl(source, kind));
        return data.images.length > 0;
      } catch (e) {
        return false;
      }
    }

    // Config polling — apply changes live when config.json is updated by the editor
    let configHash = '';
    async function checkConfigUpdate() {
      try {
        const fresh = await fetchJSON(`${API}/api/config`);
        const h = JSON.stringify(fresh);
        if (!configHash || h === configHash) { configHash = h; return; }
        configHash = h;

        // A different layout on screen requires a DOM rebuild — reload is the simplest correct path.
        // Compare the effective layout, so a rotation edit that keeps today's pick doesn't reload.
        if (PicMeRotation.resolveLayout(fresh, layouts)?.id !== activeLayoutId) {
          window.location.reload();
          return;
        }
        // So does switching the layout between separate frames and a gallery mat
        if (window.PicMeGallery && PicMeGallery.effectiveMode(fresh, activeLayout) !== activeMode) {
          window.location.reload();
          return;
        }

        // Slot mode, timer and group changes affect element setup and timers — reload too.
        // Slots the current layout doesn't show are kept up to date below without a reload.
        const slotNeedsReload = (fresh.slots || []).some((s, i) => {
          const old = (config.slots || [])[i];
          return i < activeSlots.length && old && ((s.mode || 'photos') !== (old.mode || 'photos')
            || s.cycle_seconds !== old.cycle_seconds
            || (s.group || null) !== (old.group || null));
        });
        if (slotNeedsReload) {
          window.location.reload();
          return;
        }

        // A visible slot moved to another folder (or had subfolders toggled) changes what's on
        // screen only once that source has media of the slot's kind — a missing folder (or a half-typed path) leaves the slot
        // showing what it has. A video slot then reloads (its queue and decoders are set up per
        // folder); a photo slot shows a photo from it below.
        const movedSlots = new Set();
        await Promise.all((fresh.slots || []).slice(0, activeSlots.length).map(async (s, i) => {
          const old = (config.slots || [])[i];
          const source = slotSource(s, fresh);
          if (old && source.key !== slotSource(old).key && await folderHasMedia(source, s.mode === 'video' ? 'video' : 'photos')) {
            movedSlots.add(i);
          }
        }));
        if (activeSlots.some((s, i) => s.mode === 'video' && movedSlots.has(i))) {
          window.location.reload();
          return;
        }

        // Everything else (colors, frame, metadata, audio, photo folders) — patch in place so
        // photos keep cycling
        const oldSlots = config.slots || [];
        Object.assign(config, fresh);
        config.slots = oldSlots;
        // checkRotation() and the gallery read these, so a removed key must not linger
        for (const key of ['layout_rotation', 'daily_layout_rotation', 'gallery', 'layout_modes', 'label_position']) {
          if (!(key in fresh)) delete config[key];
        }
        // Replace each slot's settings, so a key the editor dropped (e.g. after swapping two
        // slots) doesn't linger. In place: activeSlots holds these objects.
        (fresh.slots || []).forEach((s, i) => {
          const old = oldSlots[i];
          if (!old) return;
          for (const key of Object.keys(old)) if (!(key in s)) delete old[key];
          Object.assign(old, s);
        });

        // Re-apply wall color + frame (TOD template re-evaluated after config patch)
        applyTodStyles();

        activeSlots.forEach((slotCfg, i) => {
          if (slotCfg.mode === 'video') applyVideoAudio(slotCfg);
          const path = slotState[slotCfg.id]?.currentPath;
          if (path) updateOverlay(slotCfg, path);
          // A photo slot moved to another folder shows a photo from it now, not at its next cycle
          if (slotCfg.mode !== 'video' && movedSlots.has(i)) loadNextImage(slotCfg, true);
        });
        // A retry for a source no visible photo slot uses any more would only re-list it
        for (const key of Object.keys(photoRetryTimers)) {
          if (!activeSlots.some(s => s.mode !== 'video' && slotSource(s).key === key)) {
            clearTimeout(photoRetryTimers[key]);
            delete photoRetryTimers[key];
          }
        }
      } catch (e) { /* non-critical — try again next interval */ }
    }

    // Group cycling: slots in the same group advance together
    const groupTimers = {};

    function scheduleSlot(slotCfg) {
      // Video slots advance when their loops finish — a timer would cut videos off mid-play
      if (slotCfg.mode === 'video') return;
      const group = slotCfg.group;
      const seconds = slotCfg.cycle_seconds || 30;

      if (group) {
        if (!groupTimers[group]) {
          // Find all on-screen photo slots in this group
          const groupSlots = activeSlots.filter(s => s.group === group && s.mode !== 'video');
          groupTimers[group] = setInterval(() => {
            groupSlots.forEach(s => loadNextImage(s));
          }, seconds * 1000);
        }
      } else {
        setInterval(() => loadNextImage(slotCfg), seconds * 1000);
      }
    }

    // Daily rotation: reload into the new layout once the rotation day changes (see
    // layout-rotation.js). A reload rebuilds every slot, timer and decoder, like a layout
    // change from the editor. Checked by polling, so a TV waking from sleep catches up.
    const ROTATION_RELOAD_KEY = 'picme.rotationReloads';
    const ROTATION_RELOAD_LIMIT = 3;                  // rotation reloads allowed...
    const ROTATION_RELOAD_WINDOW_MS = 5 * 60 * 1000;  // ...within this window
    let rotationReloadsStopped = false;

    // Guards against a reload loop (e.g. a clock that jumps back on every page load):
    // after too many rotation reloads in a short time, stay on the current layout.
    function rotationReload() {
      const now = Date.now();
      let recent;
      try { recent = JSON.parse(sessionStorage.getItem(ROTATION_RELOAD_KEY) || '[]'); } catch (e) { recent = []; }
      if (!Array.isArray(recent)) recent = [];
      recent = recent.filter(t => typeof t === 'number' && Math.abs(now - t) < ROTATION_RELOAD_WINDOW_MS);
      if (recent.length >= ROTATION_RELOAD_LIMIT) {
        rotationReloadsStopped = true;
        console.warn(`Layout rotation reloaded ${recent.length} times in 5 minutes; staying on ${activeLayoutId}`);
        showError('Daily layout rotation keeps switching layouts. Staying on this layout; check the TV clock.');
        return;
      }
      recent.push(now);
      try { sessionStorage.setItem(ROTATION_RELOAD_KEY, JSON.stringify(recent)); } catch (e) { /* private mode */ }
      window.location.reload();
    }

    function checkRotation() {
      if (rotationReloadsStopped || !layouts) return;
      const id = PicMeRotation.resolveLayout(config, layouts)?.id;
      if (id && id !== activeLayoutId) rotationReload();
    }

    async function init() {
      try {
        [config, layouts] = await Promise.all([
          fetchJSON(`${API}/api/config`),
          fetchJSON(`${API}/api/layouts`),
        ]);
      } catch (e) {
        showError('Could not load config from server. Is the backend running?');
        return;
      }

      // A hand-emptied config.json ({} or no slots) still gets a full layout of photo slots
      if (!config || typeof config !== 'object' || Array.isArray(config)) config = {};
      if (!Array.isArray(config.slots)) config.slots = [];

      // Base layout, or today's pick from the eligible layouts when daily rotation is on.
      // Slot N is always config.slots[N-1]; slots beyond this layout's count stay dormant.
      const layout = PicMeRotation.resolveLayout(config, layouts);
      if (!layout) { showError('No layouts found.'); return; }
      activeLayoutId = layout.id;
      activeLayout = layout;
      activeMode = window.PicMeGallery ? PicMeGallery.effectiveMode(config, layout) : 'slots';

      // Pad config.slots up to the layout's slot count using slot 1's config as a template
      const slotTemplate = config.slots[0] || { mode: 'photos', source: 'local', source_path: 'photos', cycle_seconds: 30 };
      while (config.slots.length < layout.slots.length) {
        config.slots.push({ ...slotTemplate, id: config.slots.length + 1, metadata: {}, frame: {} });
      }
      activeSlots = config.slots.slice(0, layout.slots.length);
      applyLayout(layout, activeSlots.length);

      // Apply wall color and frame styles (respects TOD template if enabled)
      applyTodStyles();

      // Initialize state and load first image/video for each slot
      for (const slotCfg of activeSlots) {
        slotState[slotCfg.id] = { activeImg: 'A', activeVid: 'A', playCount: 0 };
        if (slotCfg.mode === 'video') {
          initVideoSlot(slotCfg);
          loadNextVideo(slotCfg);  // not awaited — a slow video must not hold up the other slots
        } else {
          await loadNextImage(slotCfg);
        }
      }

      // Start cycling timers
      for (const slotCfg of activeSlots) {
        scheduleSlot(slotCfg);
      }

      // Seed the hash and begin polling — display reloads automatically when config changes
      configHash = JSON.stringify(config);
      setInterval(checkConfigUpdate, 3000);

      // Re-apply TOD styles at period boundaries and switch the rotated layout at change_at
      // (checked every 30 s)
      setInterval(() => {
        if (getTodPeriodName() !== lastTodPeriod) applyTodStyles();
        checkRotation();
      }, 30000);
    }

    // Decorative frame widths, gallery openings and pill sizes depend on size, so re-fit them after a resize
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (config) applyTodStyles(); }, 150);
    });

    init();
  </script>
</body>
</html>
