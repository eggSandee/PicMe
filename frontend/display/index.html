<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PicMe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #collage {
      width: 100vw; height: 100vh;
      display: grid;
      gap: 12px;
      padding: 12px;
      background: #1a1a1a;
    }

    .slot {
      position: relative;
      overflow: hidden;
      background: #111;
    }

    /* Mat sits inside the slot, providing the matte border around the photo */
    .mat-frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f0e8;
      box-sizing: border-box;
    }

    .mat-frame img {
      width: 100%; height: 100%;
      object-fit: contain; /* default; overridden per-slot by applyFrameStyle */
      position: absolute;
      top: 0; left: 0;
      transition: opacity 0.8s ease;
    }

    .mat-frame img.hidden { opacity: 0; }
    .mat-frame img.visible { opacity: 1; }

    .slot-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
      pointer-events: none;
    }

    .overlay-pill {
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .overlay-pill.visible { opacity: 1; }

    #editor-btn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      cursor: pointer;
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 999;
    }

    body:hover #editor-btn { opacity: 1; }

    #error-banner {
      position: fixed;
      top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(200,0,0,0.85);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="collage"></div>
  <div id="error-banner"></div>
  <a id="editor-btn" href="/editor">⚙ Editor</a>

  <script>
    const API = '';  // same origin

    let config = null;
    let layouts = null;
    let activeSlots = [];

    async function fetchJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${url} returned ${r.status}`);
      return r.json();
    }

    function showError(msg) {
      const el = document.getElementById('error-banner');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 6000);
    }

    function applyLayout(layout, slotCount) {
      const collage = document.getElementById('collage');
      collage.style.gridTemplateColumns = layout.grid_template_columns;
      collage.style.gridTemplateRows = layout.grid_template_rows;

      collage.innerHTML = '';
      for (let i = 0; i < slotCount; i++) {
        const slotDef = layout.slots[i];
        const div = document.createElement('div');
        div.className = 'slot';
        div.id = `slot-${slotDef.id}`;
        div.style.gridArea = slotDef.grid_area;

        // Mat/frame wrapper — provides the matte border and optional outer frame
        const matFrame = document.createElement('div');
        matFrame.className = 'mat-frame';

        // Two img elements for crossfade, inside the mat
        const imgA = document.createElement('img');
        const imgB = document.createElement('img');
        imgA.className = 'visible';
        imgB.className = 'hidden';
        matFrame.append(imgA, imgB);

        // Metadata overlay sits above the mat, anchored to the slot.
        // Pills are created dynamically in updateOverlay so hidden fields take no space.
        const overlay = document.createElement('div');
        overlay.className = 'slot-overlay';

        div.append(matFrame, overlay);
        collage.appendChild(div);
      }
    }

    function imageUrl(filePath) {
      return `${API}/api/image?path=${encodeURIComponent(filePath)}`;
    }

    function getTimeOfDayTemplate() {
      const tod = config?.time_of_day;
      if (!tod?.enabled) return null;
      const now = new Date();
      const cur = now.getHours() * 60 + now.getMinutes();
      const [dh, dm] = (tod.day_start || '07:00').split(':').map(Number);
      const [nh, nm] = (tod.night_start || '20:00').split(':').map(Number);
      const dayMins = dh * 60 + dm, nightMins = nh * 60 + nm;
      const isDay = dayMins < nightMins
        ? (cur >= dayMins && cur < nightMins)
        : (cur >= dayMins || cur < nightMins);
      return isDay ? (tod.day || null) : (tod.night || null);
    }

    function getTodPeriodName() {
      const tod = config?.time_of_day;
      if (!tod?.enabled) return null;
      return getTimeOfDayTemplate() === tod.day ? 'day' : 'night';
    }

    let lastTodPeriod = null;

    function applyTodStyles() {
      const tod = getTimeOfDayTemplate();
      document.getElementById('collage').style.background = tod?.wall_color ?? config.wall_color ?? '#1a1a1a';
      for (const slotCfg of activeSlots) {
        const slotEl = document.getElementById(`slot-${slotCfg.id}`);
        if (slotEl) applyFrameStyle(slotEl, slotCfg);
      }
      lastTodPeriod = getTodPeriodName();
    }

    function applyFrameStyle(slotEl, slotCfg) {
      const matFrame = slotEl.querySelector('.mat-frame');
      if (!matFrame) return;

      // TOD template sits between global defaults and per-slot overrides in priority
      const tod = getTimeOfDayTemplate();
      const todFrame = tod ? { mat_color: tod.mat_color, mat_width: tod.mat_width, show_frame: tod.show_frame, frame_color: tod.frame_color, frame_width: tod.frame_width } : {};
      const frameCfg = { ...(config.frame_defaults || {}), ...todFrame, ...(slotCfg.frame || {}) };

      const matWidth  = frameCfg.mat_width  ?? 16;
      const matColor  = frameCfg.mat_color  ?? '#000000';
      const frameOn   = frameCfg.show_frame ?? true;
      const frameWidth = frameCfg.frame_width ?? 8;
      const frameColor = frameCfg.frame_color ?? '#2c2318';

      matFrame.style.padding    = `${matWidth}px`;
      matFrame.style.background = matColor;
      matFrame.style.border     = frameOn ? `${frameWidth}px solid ${frameColor}` : 'none';

      const fit = slotCfg.fill_mode === 'cover' ? 'cover' : 'contain';
      matFrame.querySelectorAll('img').forEach(img => img.style.objectFit = fit);
    }

    // Shuffled queue per folder — ensures no image repeats until all are shown,
    // and no two slots show the same image at the same time.
    const folderQueues = {};     // folder -> { images, index }
    const displayedPaths = new Set();  // paths currently visible in any slot

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function ensureQueue(folder) {
      if (folderQueues[folder]) return;
      const data = await fetchJSON(`${API}/api/images/list?folder=${encodeURIComponent(folder)}`);
      folderQueues[folder] = { images: shuffle(data.images), index: 0 };
    }

    function nextFromQueue(folder) {
      const q = folderQueues[folder];
      if (!q || q.images.length === 0) return null;
      // Walk through the queue to find an image not currently displayed
      for (let attempts = 0; attempts < q.images.length; attempts++) {
        const candidate = q.images[q.index % q.images.length];
        q.index++;
        if (q.index >= q.images.length) {
          // Reshuffle on wrap-around so we don't get the same sequence again
          shuffle(q.images);
          q.index = 0;
        }
        if (!displayedPaths.has(candidate)) return candidate;
      }
      // All images currently displayed (very small library) — allow a repeat
      return q.images[0];
    }

    // Per-slot state
    const slotState = {};

    async function loadNextImage(slotCfg) {
      const state = slotState[slotCfg.id];
      const slotEl = document.getElementById(`slot-${slotCfg.id}`);
      if (!slotEl) return;

      const folder = (slotCfg.use_global?.source !== false) ? (config.source_path || slotCfg.source_path) : slotCfg.source_path;
      await ensureQueue(folder);
      const nextPath = nextFromQueue(folder);
      if (!nextPath) return;

      const [imgA, imgB] = slotEl.querySelectorAll('img');
      const current = state.activeImg === 'A' ? imgA : imgB;
      const next    = state.activeImg === 'A' ? imgB : imgA;

      try {
        next.src = imageUrl(nextPath);
        await new Promise((resolve, reject) => {
          next.onload = resolve;
          next.onerror = reject;
        });
        // Release the old image from the displayed set, claim the new one
        if (state.currentPath) displayedPaths.delete(state.currentPath);
        displayedPaths.add(nextPath);
        state.currentPath = nextPath;

        next.className = 'visible';
        current.className = 'hidden';
        state.activeImg = state.activeImg === 'A' ? 'B' : 'A';

        updateOverlay(slotCfg, nextPath);
      } catch (e) {
        console.warn(`Slot ${slotCfg.id}: failed to load image`, e);
      }
    }

    // Non-date fields in priority order. max_metadata_pills applies to these only.
    // Date is handled separately — always rendered last (bottom) if enabled.
    const METADATA_FIELDS = [
      { flag: 'show_location',      key: 'location' },
      { flag: 'show_camera',        key: 'camera' },
      { flag: 'show_megapixels',    key: 'megapixels' },
      { flag: 'show_fstop',         key: 'fstop' },
      { flag: 'show_shutter_speed', key: 'shutter_speed' },
      { flag: 'show_iso',           key: 'iso' },
      { flag: 'show_focal_length',  key: 'focal_length' },
    ];

    const DATE_FORMATS = {
      long:   { year: 'numeric', month: 'long',    day: 'numeric' }, // July 4, 2019
      medium: { year: 'numeric', month: 'short',   day: 'numeric' }, // Jul 4, 2019
      short:  { year: 'numeric', month: 'numeric', day: 'numeric' }, // 7/4/2019
    };

    function formatDate(isoDate) {
      const fmt = config.date_format || 'long';
      if (fmt === 'iso') return isoDate;
      const opts = DATE_FORMATS[fmt] || DATE_FORMATS.long;
      // Parse as local date (append T00:00 to avoid UTC shift)
      return new Intl.DateTimeFormat(undefined, opts).format(new Date(isoDate + 'T00:00'));
    }

    async function updateOverlay(slotCfg, imagePath) {
      // Global kill switch
      if (config.show_metadata === false) return;

      // Respect use_global.metadata: if true, use only global defaults (slot.metadata is empty)
      const meta = (slotCfg.use_global?.metadata !== false)
        ? (config.metadata_defaults || {})
        : { ...(config.metadata_defaults || {}), ...(slotCfg.metadata || {}) };

      const maxPills = config.max_metadata_pills ?? Infinity;
      const anyEnabled = meta.show_date || METADATA_FIELDS.some(f => meta[f.flag]);

      const slotEl = document.getElementById(`slot-${slotCfg.id}`);
      if (!slotEl) return;
      const overlay = slotEl.querySelector('.slot-overlay');
      if (!overlay) return;

      // Clear previous pills completely — hidden elements in a flex column take up space
      overlay.innerHTML = '';
      if (!anyEnabled) return;

      try {
        const data = await fetchJSON(`${API}/api/metadata?path=${encodeURIComponent(imagePath)}`);

        const pills = [];

        // Non-date fields up to the cap
        let shown = 0;
        for (const { flag, key } of METADATA_FIELDS) {
          if (shown >= maxPills) break;
          if (!meta[flag] || !data[key]) continue;
          const pill = document.createElement('div');
          pill.className = 'overlay-pill';
          pill.textContent = data[key];
          pills.push(pill);
          shown++;
        }

        // Date always at bottom, not counted against the cap
        if (meta.show_date && data.date_iso) {
          const pill = document.createElement('div');
          pill.className = 'overlay-pill';
          pill.textContent = formatDate(data.date_iso);
          pills.push(pill);
        }

        if (pills.length === 0) return;
        pills.forEach(p => overlay.appendChild(p));
        // Double rAF so the browser registers the initial opacity:0 before transitioning to 1
        requestAnimationFrame(() => requestAnimationFrame(() => {
          pills.forEach(p => p.classList.add('visible'));
        }));
      } catch (e) {
        // Metadata is non-critical — fail silently
      }
    }

    // Config polling — apply changes live when config.json is updated by the editor
    let configHash = '';
    async function checkConfigUpdate() {
      try {
        const fresh = await fetchJSON(`${API}/api/config`);
        const h = JSON.stringify(fresh);
        if (!configHash || h === configHash) { configHash = h; return; }
        configHash = h;

        // Layout changes require a DOM rebuild — reload is the simplest correct path
        if (fresh.layout !== config.layout || fresh.daily_layout_rotation !== config.daily_layout_rotation) {
          window.location.reload();
          return;
        }

        // Everything else (colors, frame, metadata) — patch in place so photos keep cycling
        const oldSlots = config.slots;
        Object.assign(config, fresh);
        config.slots = oldSlots;
        (fresh.slots || []).forEach((s, i) => { if (oldSlots[i]) Object.assign(oldSlots[i], s); });

        // Re-apply wall color + frame (TOD template re-evaluated after config patch)
        applyTodStyles();

        for (const slotCfg of activeSlots) {
          const path = slotState[slotCfg.id]?.currentPath;
          if (path) updateOverlay(slotCfg, path);
        }
      } catch (e) { /* non-critical — try again next interval */ }
    }

    // Group cycling: slots in the same group advance together
    const groupTimers = {};

    function scheduleSlot(slotCfg) {
      const group = slotCfg.group;
      const seconds = slotCfg.cycle_seconds || 30;

      if (group) {
        if (!groupTimers[group]) {
          // Find all slots in this group
          const groupSlots = config.slots.filter(s => s.group === group);
          groupTimers[group] = setInterval(() => {
            groupSlots.forEach(s => loadNextImage(s));
          }, seconds * 1000);
        }
      } else {
        setInterval(() => loadNextImage(slotCfg), seconds * 1000);
      }
    }

    async function init() {
      try {
        [config, layouts] = await Promise.all([
          fetchJSON(`${API}/api/config`),
          fetchJSON(`${API}/api/layouts`),
        ]);
      } catch (e) {
        showError('Could not load config from server. Is the backend running?');
        return;
      }

      // If daily rotation is on, pick a layout by day-of-year so it changes each day
      // but stays consistent throughout the day. Layout selection (choosing which
      // layouts are eligible) is planned for M4.
      let layout;
      if (config.daily_layout_rotation && layouts.length > 1) {
        const now = new Date();
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
        layout = layouts[dayOfYear % layouts.length];
      } else {
        layout = layouts.find(l => l.id === config.layout) || layouts[0];
      }
      if (!layout) { showError('No layouts found.'); return; }

      // Pad config.slots up to the layout's slot count using slot 1's config as a template
      const slotTemplate = config.slots[0] || { mode: 'photos', source: 'local', source_path: 'photos', cycle_seconds: 30 };
      while (config.slots.length < layout.slots.length) {
        config.slots.push({ ...slotTemplate, id: config.slots.length + 1, metadata: {}, frame: {} });
      }
      activeSlots = config.slots.slice(0, layout.slots.length);
      applyLayout(layout, activeSlots.length);

      // Apply wall color and frame styles (respects TOD template if enabled)
      applyTodStyles();

      // Initialize state and load first image for each slot
      for (const slotCfg of activeSlots) {
        slotState[slotCfg.id] = { activeImg: 'A' };
        await loadNextImage(slotCfg);
      }

      // Start cycling timers
      for (const slotCfg of activeSlots) {
        scheduleSlot(slotCfg);
      }

      // Seed the hash and begin polling — display reloads automatically when config changes
      configHash = JSON.stringify(config);
      setInterval(checkConfigUpdate, 3000);

      // Re-apply TOD styles at period boundaries (checked every minute)
      setInterval(() => { if (getTodPeriodName() !== lastTodPeriod) applyTodStyles(); }, 60000);
    }

    init();
  </script>
</body>
</html>
